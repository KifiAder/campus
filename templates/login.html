<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Биржа проектов</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/login.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        Биржа проектов
      </a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" data-theme-toggle>☾</button>
        <div class="topbar__actions" data-header-user></div>
      </div>
    </div>
  </header>

  <main class="auth">
    <div class="auth__box">
      <p class="auth__kicker">Вход</p>
      <h1 class="auth__title">С возвращением</h1>

      <div class="notice" id="notice" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login">Логин</label>
          <input class="input" id="login" name="login" type="text"
                 autocomplete="username" placeholder="ivan_petrov" maxlength="32">
          <div class="field__hint" data-default=""></div>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Ваш пароль" maxlength="72">
            <button class="reveal" type="button" data-reveal="password">показать</button>
          </div>
          <div class="field__hint" data-default=""></div>
        </div>

        <button class="btn btn--primary btn--block" type="submit" id="submit">Войти</button>
      </form>

      <p class="auth__foot">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
      </p>

      <!-- Тестовые аккаунты из schema.sql — пароли не подставляем в поля -->
      <details class="small muted" style="margin-top:14px">
        <summary style="cursor:pointer">Тестовые аккаунты</summary>
        <p style="margin:8px 0 0">
          Студент: <span class="mono">timosh / student123</span><br>
          Куратор: <span class="mono">curator / admin123</span>
        </p>
      </details>
    </div>
  </main>
</body>
</html>
